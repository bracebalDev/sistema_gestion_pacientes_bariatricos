<text x="28" y="264"><tspan class="t-bold"># Skill: Validate Tablet UX/UI</tspan></text>
<text x="28" y="285"><tspan class="t-info">## Validation Checklist (Normas Apple HIG &amp; WCAG AA)</tspan></text>
<text x="28" y="306"><tspan class="t-success">  1. Touch Targets: min-height: 44px, min-width: 44px, gap &gt;= 8px</tspan></text>
<text x="28" y="327"><tspan class="t-success">  2. Typography: base font-size &gt;= 16px on tablets, line-height &gt;= 1.4</tspan></text>
<text x="28" y="348"><tspan class="t-success">  3. Responsive Layout: Breakpoints 768px, 1024px, 1366px, sidebar auto-collapse</tspan></text>
<text x="28" y="369"><tspan class="t-success">  4. Color Contrast: Primary text &gt;= 4.5:1, brand badges &gt;= 3:1</tspan></text>
<text x="28" y="390"><tspan class="t-success">  5. Orientation: Flawless layout in both Portrait and Landscape modes</tspan></text>

